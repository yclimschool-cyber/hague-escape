<!doctype html>
<html lang="ko">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>特使文書 — 1907, 헤이그</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;600;900&display=swap" rel="stylesheet">
<style>
/* 특사가 지니고 다니는 한 권의 문서: 상황마다 한 장씩 이어서 펼친다 */
:root {
  --desk: #2a2018; --paper: #efe3c6; --paper2: #e6d6b2; --ink: #2b1f14; --ink-soft: #6a5640;
  --rule: #b9a27a; --seal: #9b2c1f; --seal-ink: #fbf3e2;
  --serif: 'Noto Serif KR', 'Nanum Myeongjo', 'Batang', serif;
  --sans: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'D2Coding', monospace;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--desk); }
body { margin: 0; background: var(--desk); color: var(--ink); font-family: var(--serif); font-size: 16px; line-height: 1.75;
  padding: 20px max(12px, env(safe-area-inset-left)) 48px max(12px, env(safe-area-inset-right)); }
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
b { font-weight: 900; }

.sheet { max-width: 680px; margin: 0 auto; background: var(--paper);
  background-image: radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.35), transparent 60%), radial-gradient(ellipse at 90% 95%, rgba(120,80,30,.14), transparent 55%);
  border: 1px solid var(--rule); box-shadow: 0 10px 40px rgba(0,0,0,.44); padding: clamp(20px, 5vw, 44px); display: flex; flex-direction: column; gap: 26px; }

/* 제호 */
.mast { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.mast .tag { font-size: 13px; letter-spacing: .3em; color: var(--seal); font-weight: 600; }
.mast h1 { font-weight: 900; font-size: clamp(34px, 9vw, 48px); letter-spacing: .18em; margin: 0; line-height: 1.15; }
.mast .sub { margin: 0; font-size: 14px; color: var(--ink-soft); }

/* 시작 안내 */
.notice { margin: 0; border-top: 3px double var(--ink); padding-top: 18px; }
.notice ol { margin: 8px 0 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.notice b { color: var(--seal); }
.start { align-self: center; }

/* 상황 꼬리표 */
.tabs { display: flex; overflow-x: auto; border-top: 3px double var(--ink); border-bottom: 1px solid var(--ink); margin: 0 calc(-1 * clamp(20px, 5vw, 44px)); padding: 0 calc(clamp(20px, 5vw, 44px) - 6px); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; min-width: 92px; background: none; border: none; color: var(--ink-soft); padding: 10px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; line-height: 1.35; font-family: var(--serif); }
.tab .k { font-size: 11.5px; letter-spacing: .04em; white-space: nowrap; }
.tab .t { font-size: 15.5px; font-weight: 900; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--seal); background: var(--paper2); box-shadow: inset 0 -3px 0 var(--seal); }
.tab:disabled { opacity: .4; cursor: default; }

/* 한 장 */
.leaf { display: flex; flex-direction: column; gap: 28px; }
.lead { margin: 0; text-align: center; color: var(--ink-soft); font-size: 15px; }
section { display: flex; flex-direction: column; gap: 12px; }
h2 { font-weight: 900; font-size: 21px; margin: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
h2 .hj { font-size: 14px; font-weight: 600; color: var(--seal); letter-spacing: .12em; }
.intro { margin: 0; color: var(--ink-soft); }
ol.law { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
ol.law > li { display: grid; grid-template-columns: 4.2em minmax(0, 1fr); gap: 8px; }
ol.law ul { margin: 6px 0 0; padding-left: 1.1em; }
.jo { font-weight: 900; color: var(--seal); }
.ex { background: var(--paper2); border-left: 3px solid var(--seal); padding: 10px 14px; font-size: 15px; }
.note { font-size: 14px; color: var(--ink-soft); margin: 0; }
.mono { font-family: var(--mono); letter-spacing: .14em; white-space: nowrap; }
.given { display: flex; flex-wrap: wrap; gap: 8px 22px; justify-content: center; font-size: 15px; }
.given b { color: var(--seal); }
.steps { display: flex; flex-direction: column; gap: 10px; background: var(--paper2); border: 1px solid var(--rule); padding: 16px 18px; }
.steps p { margin: 0; display: grid; grid-template-columns: 2.4em minmax(0, 1fr); gap: 6px; }
.steps .m { font-weight: 900; color: var(--seal); }
.eq { font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums; }
.blank { display: inline-block; min-width: 3.2em; border-bottom: 1.5px solid var(--ink); text-align: center; font-family: var(--serif); font-weight: 900; }
.ask { margin: 0; font-weight: 600; text-align: center; }
figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
figure img { width: 100%; height: auto; display: block; border: 1px solid var(--rule); }
figcaption { font-size: 13px; color: var(--ink-soft); text-align: center; }
.wire { background: var(--paper2); border: 1px solid var(--rule); padding: 16px 0; overflow-x: auto; }
.wire table { border-collapse: collapse; margin: 0 auto; font-family: var(--mono); font-size: clamp(14px, 3.8vw, 17px); }
.wire td { padding: 3px 12px; white-space: nowrap; }
.wire td.n { color: var(--ink-soft); font-size: 12px; text-align: right; padding-right: 6px; font-variant-numeric: tabular-nums; border-right: 1px solid var(--rule); }
.wire td.c { letter-spacing: .16em; }

/* 별지 */
.annex { border: 1.5px dashed var(--seal); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.annex p { margin: 0; }
.open { align-self: center; font-family: var(--serif); font-weight: 900; font-size: 16px; letter-spacing: .08em; background: var(--seal); color: var(--seal-ink); border: none; border-radius: 50%;
  width: 112px; height: 112px; cursor: pointer; box-shadow: inset 0 0 0 4px var(--seal), inset 0 0 0 6px var(--seal-ink); line-height: 1.3; }
.open:active { transform: scale(.97); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 18px; }
.grid2 div { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); gap: 8px; padding: 5px 2px; border-bottom: 1px solid var(--rule); align-items: baseline; }
.grid2 .v { font-weight: 900; text-align: right; font-variant-numeric: tabular-nums; }
.grid2 .s { font-family: var(--mono); letter-spacing: .1em; font-size: 15px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
@media (max-width: 420px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.reveal { animation: unfold .5s ease-out; }
@keyframes unfold { from { opacity: .2; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

/* 준비 중·게임 */
.todo { border: 1.5px dashed var(--ink-soft); padding: 28px 16px; text-align: center; color: var(--ink-soft); }
.todo b { display: block; color: var(--ink); font-size: 17px; }
.game { text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; }
.game p { margin: 0; }

/* 버튼 */
.btn { display: inline-block; font-family: var(--serif); font-weight: 900; font-size: 17px; letter-spacing: .06em; padding: 11px 28px; border: none; border-radius: 3px; cursor: pointer;
  background: var(--seal); color: var(--seal-ink); box-shadow: 0 3px 0 #5e170f; text-decoration: none; }
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn.small { font-size: 15px; padding: 8px 18px; }

/* 다음 장 열기 */
.gate { border-top: 3px double var(--ink); padding-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.gate p { margin: 0; font-size: 15px; color: var(--ink-soft); }
.gate .row { display: flex; gap: 8px; justify-content: center; }
.gate input { width: 190px; max-width: 56vw; font-size: 17px; padding: 8px 10px; border: 1.5px solid var(--ink); background: #fbf5e4; text-align: center; border-radius: 3px; }
.msg { min-height: 22px; font-size: 14px; font-family: var(--sans); color: var(--seal); }
.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

footer { font-size: 12px; color: var(--ink-soft); text-align: center; border-top: 1px solid var(--rule); padding-top: 14px; }
</style>
</head>

'use strict';
// SHA-256 (crypto.subtle을 쓸 수 없는 환경용)
function sha256js(str) {
  const bytes = new TextEncoder().encode(str);
  const rr = (v, n) => (v >>> n) | (v << (32 - n));
  const K = [], H0 = [], comp = {};
  for (let c = 2, n = 0; n < 64; c++) {
    if (comp[c]) continue;
    for (let i = c * c; i < 400; i += c) comp[i] = 1;
    if (n < 8) H0[n] = (Math.pow(c, 1 / 2) * 4294967296) | 0;
    K[n++] = (Math.pow(c, 1 / 3) * 4294967296) | 0;
  }
  const len = bytes.length, total = ((len + 9 + 63) >> 6) << 6;
  const buf = new Uint8Array(total);
  buf.set(bytes); buf[len] = 0x80;
  const bits = len * 8, dv = new DataView(buf.buffer);
  dv.setUint32(total - 4, bits >>> 0); dv.setUint32(total - 8, Math.floor(bits / 4294967296));
  let h = H0.slice();
  const w = new Array(64);
  for (let off = 0; off < total; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getInt32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const a = w[i - 15], b = w[i - 2];
      w[i] = (w[i - 16] + (rr(a, 7) ^ rr(a, 18) ^ (a >>> 3)) + w[i - 7] + (rr(b, 17) ^ rr(b, 19) ^ (b >>> 10))) | 0;
    }
    let [A, B, C, D, E, F, G, Hh] = h;
    for (let i = 0; i < 64; i++) {
      const t1 = (Hh + (rr(E, 6) ^ rr(E, 11) ^ rr(E, 25)) + ((E & F) ^ (~E & G)) + K[i] + w[i]) | 0;
      const t2 = ((rr(A, 2) ^ rr(A, 13) ^ rr(A, 22)) + ((A & B) ^ (A & C) ^ (B & C))) | 0;
      Hh = G; G = F; F = E; E = (D + t1) | 0; D = C; C = B; B = A; A = (t1 + t2) | 0;
    }
    h = [A, B, C, D, E, F, G, Hh].map((v, i) => (v + h[i]) | 0);
  }
  return h.map(v => (v >>> 0).toString(16).padStart(8, '0')).join('');
}

  ];

  // 별지 표 내용
  const ANNEX = {
    annex2: { note: '甲(55) 배수표 — 1728을 넘지 않는 가장 큰 수를 찾아라.',
      rows: () => Array.from({ length: 35 }, (_, i) => ['× ' + (i + 1), String(55 * (i + 1))]) },
    annex3: { note: '소수 점획표 — 전보의 모양과 같은 것을 찾아라.',
      rows: () => { const r = []; for (let n = 2; n < 90; n++) { let p = true; for (let d = 2; d * d <= n; d++) if (n % d === 0) { p = false; break; } if (p) r.push([String(n), '-'.repeat(Math.floor(n / 10)) + '.'.repeat(n % 10)]); } return r; } },
  };
  const WIRE = ['------.......', '-------...', '.. .. ... .......', '--------.........', '.. .. .. .. ..', '.. .. .. ... ...', '..... -...', '.. .. -.........', '.. .. -.........',
    '.. .. .. .. ..', '.. .. .. .. .....', '....... -.', '.. .. .. .. ..', '.. ... -...', '-------...', '.. ... -...', '... --...'];

  // ---------- 진행 저장 ----------
  const KEY = 'hague1907_hub_v1';
  let S = { started: false, unlocked: 0, cur: 0, annex: {} };
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  S.annex = S.annex || {};
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  // 같은 기기에서 게임을 마쳤다면 5번 장을 연다
  function syncGame() {
    try {
      const g = JSON.parse(localStorage.getItem('hague1907_save_v1') || 'null');
      if (g && g.phase === 'success' && S.unlocked < 4) { S.unlocked = 4; save(); }
    } catch (e) {}
  }

  const $ = s => document.querySelector(s);
  function el(tag, attrs, html) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (html != null) e.innerHTML = html;
    return e;
  }

  function renderTabs() {
    const nav = $('#tabs'); nav.innerHTML = '';
    QS.forEach((q, i) => {
      const locked = i > S.unlocked;
      const b = el('button', { class: 'tab', role: 'tab', type: 'button', 'aria-selected': String(i === S.cur) },
        `<span class="k">${q.k}</span><span class="t">${locked ? '🔒 ' : ''}${q.t}</span>`);
      b.disabled = locked;
      b.onclick = () => go(i);
      nav.appendChild(b);
    });
    const on = nav.children[S.cur];
    if (on) on.scrollIntoView({ block: 'nearest', inline: 'center' });
  }

  function go(i) {
    S.cur = Math.max(0, Math.min(i, S.unlocked)); save();
    renderTabs(); renderLeaf();
    window.scrollTo({ top: 0 });
  }

  function openAnnex(id, anim) {
    const box = document.getElementById(id); if (!box) return;
    const wrap = box.parentElement;
    wrap.querySelector('[data-open]').hidden = true;
    wrap.querySelector('[data-note]').textContent = ANNEX[id].note;
    box.innerHTML = '';
    ANNEX[id].rows().forEach(([v, s]) => {
      const d = el('div'); d.append(el('span', { class: 'v' }), el('span', { class: 's' }));
      d.firstChild.textContent = v; d.lastChild.textContent = s; box.appendChild(d);
    });
    box.hidden = false;
    if (anim) box.classList.add('reveal');
  }

  function renderLeaf() {
    const i = S.cur, q = QS[i], leaf = $('#leaf');
    leaf.innerHTML = q.html;

    const wire = leaf.querySelector('#wire');
    if (wire) WIRE.forEach((l, n) => { const tr = el('tr', null, `<td class="n">${n + 1}</td><td class="c"></td>`); tr.lastChild.textContent = l; wire.appendChild(tr); });
    leaf.querySelectorAll('[data-open]').forEach(b => {
      const id = b.dataset.open;
      b.onclick = () => { openAnnex(id, true); S.annex[id] = 1; save(); };
      if (S.annex[id]) openAnnex(id, false);
    });

    if (i === QS.length - 1) return;
    const gate = el('div', { class: 'gate' });
    if (S.unlocked > i) {
      gate.appendChild(nextBtn(i, false));
    } else if (!q.answer) {
      gate.appendChild(el('p', null, `폼의 ${i + 1}번 문항을 풀었다면 다음 장으로 넘어가세요.`));
      gate.appendChild(nextBtn(i, true));
    } else {
      gate.appendChild(el('p', null, q.gateText || `폼의 ${i + 1}번 문항에 적은 답을 여기에도 적으면 다음 장이 열립니다.`));
      const row = el('div', { class: 'row' });
      const inp = el('input', { type: 'text', placeholder: `${i + 1}번 답`, autocomplete: 'off', spellcheck: 'false' });
      const b = el('button', { class: 'btn small', type: 'button' }, '확인');
      const msg = el('div', { class: 'msg' });
      let busy = false;
      const check = async () => {
        if (busy || !inp.value.trim()) return;
        busy = true;
        const ok = (await sha(i + '|' + norm(inp.value))) === q.answer;
        busy = false;
        if (ok) { unlock(i); return; }
        row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
        msg.textContent = '폼에 적은 답과 맞지 않는 것 같습니다. 다시 확인해 보세요.';
      };
      b.onclick = check;
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
      row.append(inp, b); gate.append(row, msg);
    }
    leaf.appendChild(gate);
  }
  function nextBtn(i, unlocks) {
    const b = el('button', { class: 'btn', type: 'button' }, `다음 장 넘기기 · ${QS[i + 1].k.split(' · ')[0]}`);
    b.onclick = () => (unlocks ? unlock(i) : go(i + 1));
    return b;
  }
  function unlock(i) { S.unlocked = Math.max(S.unlocked, i + 1); save(); go(i + 1); }

  function start() {
    S.started = true; save();
    $('#intro').hidden = true; $('#tabs').hidden = false; $('#leaf').hidden = false;
    go(S.cur);
  }

  syncGame();
  $('#btnStart').onclick = start;
  // 게임 엔딩의 '5번 문항 진행하기'에서 왔을 때 (?q=5)
  const want = +(new URLSearchParams(location.search).get('q') || 0);
  if (want) { S.cur = want - 1; start(); }
  else if (S.started) start();
})();
</script>
</body>
</html>
