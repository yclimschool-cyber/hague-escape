<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b2a1a">
<title>힌트 자료실 — 1907, 헤이그</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root {
  --desk: #2a2018; --paper: #efe3c6; --paper2: #e4d3ab; --paper3: #d6c095;
  --ink: #3b2a1a; --ink2: #6b5338; --seal: #9b2c1f;
  --serif: 'Noto Serif KR', 'Batang', serif; --sans: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--desk); color: var(--ink); font-family: var(--serif); }
body { padding: 0 0 40px; }
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.wrap { max-width: 720px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; }
.paper {
  background-color: var(--paper);
  background-image: radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.4), transparent 60%), repeating-linear-gradient(0deg, rgba(90,60,20,.035) 0 1px, transparent 1px 3px);
}

/* 제호 */
.mast { text-align: center; padding: 18px 16px 12px; border-bottom: 3px double var(--ink); }
.mast .tag { font-size: 12px; letter-spacing: .3em; color: var(--seal); font-weight: 600; }
.mast h1 { margin: 4px 0 2px; font-size: 28px; font-weight: 900; letter-spacing: .06em; }
.mast .sub { margin: 0; font-size: 14px; color: var(--ink2); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); display: inline-block; padding: 2px 14px; }

/* 시작 안내 */
#intro { padding: 22px 16px 28px; text-align: center; }
.notice { text-align: left; background: rgba(255,255,255,.4); border: 1px solid var(--paper3); padding: 14px 16px; line-height: 1.75; font-size: 15px; margin: 0 0 22px; }
.notice b { color: var(--seal); }
.notice ol { margin: 8px 0 0; padding-left: 20px; }
.btn { display: inline-block; border: 1.5px solid var(--ink); background: var(--paper2); padding: 10px 18px; border-radius: 4px; font-weight: 600; font-size: 15px;
  cursor: pointer; box-shadow: 0 2px 0 var(--ink); text-decoration: none; color: var(--ink); }
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn.big { font-size: 18px; padding: 12px 34px; background: var(--seal); color: var(--paper); border-color: #5e170f; box-shadow: 0 3px 0 #5e170f; }
.btn:disabled { opacity: .44; pointer-events: none; }

/* 문항 단계 */
#steps { display: flex; gap: 6px; padding: 10px 12px; overflow-x: auto; border-bottom: 1px solid var(--paper3); }
#steps button { flex: none; position: relative; border: none; background: var(--paper2); color: var(--ink); padding: 6px 12px 6px 20px; font-size: 13.5px;
  clip-path: polygon(9px 0, 100% 0, 100% 100%, 9px 100%, 0 50%); box-shadow: inset 0 0 0 1px #9c8058; cursor: pointer; }
#steps button::before { content: ''; position: absolute; left: 9px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 0 0 1px #6b5338; }
#steps button.on { background: var(--seal); color: var(--paper); box-shadow: none; font-weight: 700; }
#steps button:disabled { opacity: .44; cursor: default; }

/* 문항 본문 */
#q { padding: 18px 16px 8px; }
#q h2 { margin: 0 0 4px; font-size: 22px; font-weight: 900; }
#q .lead { margin: 0 0 16px; color: var(--ink2); font-size: 14.5px; line-height: 1.7; }
.frame-box { margin: 0 -16px; background: var(--desk); }
.frame-box iframe { display: block; width: 100%; height: 80vh; border: 0; }
.todo { border: 1.5px dashed var(--ink2); padding: 28px 16px; text-align: center; color: var(--ink2); line-height: 1.7; background: rgba(255,255,255,.3); }
.todo b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
.game-card { border: 1px solid var(--paper3); background: rgba(255,255,255,.35); padding: 18px 16px; text-align: center; line-height: 1.75; }
.game-card p { margin: 0 0 14px; }

/* 다음 자료 열기 */
.gate { margin: 22px 0 6px; padding: 16px; border-top: 3px double var(--ink); text-align: center; }
.gate p { margin: 0 0 12px; font-size: 14.5px; line-height: 1.7; }
.gate .row { display: flex; gap: 8px; justify-content: center; }
.gate input { width: 190px; max-width: 60vw; font-size: 17px; padding: 8px 10px; border: 1.5px solid var(--ink); background: #fbf5e4; text-align: center; border-radius: 3px; }
.msg { min-height: 22px; margin-top: 10px; font-size: 14px; font-family: var(--sans); }
.msg.err { color: var(--seal); }
.msg.ok { color: #3b6a1a; }
.done { text-align: center; color: var(--ink2); font-size: 14px; margin: 22px 0 0; }
.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
footer { text-align: center; font-size: 12px; color: #a58c66; padding: 18px 16px 0; }
</style>
</head>
<body>
<div class="wrap paper">
  <header class="mast">
    <div class="tag">1907 · 헤이그 특사</div>
    <h1>닫힌 문 너머로</h1>
    <p class="sub">문항별 힌트 자료실</p>
  </header>

  <section id="intro">
    <div class="notice">
      이 자료실은 <b>구글 폼과 함께</b> 진행합니다.
      <ol>
        <li>구글 폼과 이 페이지를 <b>둘 다 열어 두세요.</b> (폼은 다른 탭이나 다른 기기에서)</li>
        <li>폼의 문항을 풀 때, 여기서 <b>같은 번호의 자료</b>를 보며 단서를 찾으세요.</li>
        <li>폼에 정답을 적었다면, 같은 답을 이 페이지에도 입력해야 <b>다음 문항 자료</b>가 열립니다.</li>
      </ol>
    </div>
    <button id="btnStart" class="btn big">시작하기</button>
  </section>

  <section id="main" hidden>
    <nav id="steps"></nav>
    <article id="q"></article>
  </section>

  <footer>1907년 헤이그 특사 사건을 바탕으로 한 역사 방탈출 수업 자료입니다.</footer>
</div>

<script>
'use strict';
// SHA-256 (crypto.subtle을 쓸 수 없는 환경용)
function sha256js(str) {
  const bytes = new TextEncoder().encode(str);
  const rr = (v, n) => (v >>> n) | (v << (32 - n));
  const K = [], H0 = [], comp = {};
  for (let c = 2, n = 0; n < 64; c++) {
    if (comp[c]) continue;
    for (let i = c * c; i < 400; i += c) comp[i] = 1;
    if (n < 8) H0[n] = (Math.pow(c, 1 / 2) * 4294967296) | 0;
    K[n++] = (Math.pow(c, 1 / 3) * 4294967296) | 0;
  }
  const len = bytes.length, total = ((len + 9 + 63) >> 6) << 6;
  const buf = new Uint8Array(total);
  buf.set(bytes); buf[len] = 0x80;
  const bits = len * 8, dv = new DataView(buf.buffer);
  dv.setUint32(total - 4, bits >>> 0); dv.setUint32(total - 8, Math.floor(bits / 4294967296));
  let h = H0.slice();
  const w = new Array(64);
  for (let off = 0; off < total; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getInt32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const a = w[i - 15], b = w[i - 2];
      w[i] = (w[i - 16] + (rr(a, 7) ^ rr(a, 18) ^ (a >>> 3)) + w[i - 7] + (rr(b, 17) ^ rr(b, 19) ^ (b >>> 10))) | 0;
    }
    let [A, B, C, D, E, F, G, Hh] = h;
    for (let i = 0; i < 64; i++) {
      const t1 = (Hh + (rr(E, 6) ^ rr(E, 11) ^ rr(E, 25)) + ((E & F) ^ (~E & G)) + K[i] + w[i]) | 0;
      const t2 = ((rr(A, 2) ^ rr(A, 13) ^ rr(A, 22)) + ((A & B) ^ (A & C) ^ (B & C))) | 0;
      Hh = G; G = F; F = E; E = (D + t1) | 0; D = C; C = B; B = A; A = (t1 + t2) | 0;
    }
    h = [A, B, C, D, E, F, G, Hh].map((v, i) => (v + h[i]) | 0);
  }
  return h.map(v => (v >>> 0).toString(16).padStart(8, '0')).join('');
}

(() => {
  const SALT = 'hub1|';
  async function sha(s) {
    const str = (SALT + s).normalize('NFC');
    try {
      if (window.crypto && crypto.subtle) {
        const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
        return Array.from(new Uint8Array(b), x => x.toString(16).padStart(2, '0')).join('');
      }
    } catch (e) {}
    return sha256js(str);
  }
  // 대소문자·띄어쓰기 무시
  const norm = v => String(v || '').trim().toUpperCase().replace(/\s+/g, '').normalize('NFC');

  // 문항 구성. answer: 이 문항 정답의 해시(다음 자료를 연다). null이면 정답 확인 없이 '다음' 버튼.
  const QS = [
    { kind: 'todo', lead: '1번 문항을 풀 때 볼 자료입니다.', answer: null },
    { kind: 'frame', src: 'hints/q2.html', lead: '공사관에서 보낸 비밀 전보입니다. 해독법을 따라 전보를 서양 글자로 옮겨 보세요.', answer: null },
    { kind: 'todo', lead: '3번 문항을 풀 때 볼 자료입니다.', answer: null },
    { kind: 'game', lead: '헤이그에 도착한 특사 일행이 되어 방탈출 게임을 풀어 보세요.', answer: 'bdf994a04a96261467ced466c6b4e59590c378aa911acf699dd373bdfc347938',
      gateText: '게임을 마치고 받은 쪽지 내용을 폼에 적었다면, 같은 내용을 여기에도 입력하세요. (게임을 이 기기에서 마쳤다면 자동으로 열립니다.)' },
    { kind: 'todo', lead: '5번 문항을 풀 때 볼 자료입니다.', answer: null },
  ];

  // 진행 저장
  const KEY = 'hague1907_hub_v1';
  let S = { started: false, unlocked: 0, cur: 0 };
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  // 같은 기기에서 게임을 마쳤다면 5번 자료를 연다
  function syncGame() {
    try {
      const g = JSON.parse(localStorage.getItem('hague1907_save_v1') || 'null');
      if (g && g.phase === 'success' && S.unlocked < 4) { S.unlocked = 4; save(); }
    } catch (e) {}
  }

  const $ = s => document.querySelector(s);
  function el(tag, attrs, html) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (html != null) e.innerHTML = html;
    return e;
  }

  function renderSteps() {
    const nav = $('#steps'); nav.innerHTML = '';
    QS.forEach((q, i) => {
      const b = el('button', { type: 'button' }, `${i + 1}번${i > S.unlocked ? ' 🔒' : ''}`);
      b.disabled = i > S.unlocked;
      if (i === S.cur) b.className = 'on';
      b.onclick = () => go(i);
      nav.appendChild(b);
    });
  }

  function go(i) {
    S.cur = Math.max(0, Math.min(i, S.unlocked)); save();
    renderSteps(); renderQ();
    window.scrollTo({ top: 0 });
  }

  function fitFrame(f) {
    // 같은 출처면 내용 높이에 맞추고, 아니면 80vh 안에서 스크롤
    try {
      const d = f.contentDocument;
      const fit = () => { f.style.height = Math.max(400, d.documentElement.scrollHeight) + 'px'; };
      fit();
      if (window.ResizeObserver) new ResizeObserver(fit).observe(d.body);
    } catch (e) {}
  }

  function renderQ() {
    const i = S.cur, q = QS[i], box = $('#q');
    box.innerHTML = '';
    box.appendChild(el('h2', null, `${i + 1}번 문항 자료`));
    box.appendChild(el('p', { class: 'lead' }, q.lead));

    if (q.kind === 'frame') {
      const wrap = el('div', { class: 'frame-box' });
      const f = el('iframe', { src: q.src, title: `${i + 1}번 문항 자료` });
      f.addEventListener('load', () => fitFrame(f));
      wrap.appendChild(f); box.appendChild(wrap);
    } else if (q.kind === 'game') {
      box.appendChild(el('div', { class: 'game-card' }, `<p>1907년 6월, 회의장 문 앞에서 돌아선 특사 일행.<br>방을 살피고 단서를 모아 세계에 목소리를 전하세요.</p>
        <a class="btn big" href="game/">헤이그 방탈출 시작하기</a>`));
    } else {
      box.appendChild(el('div', { class: 'todo' }, '<b>자료 준비 중</b>선생님이 곧 이 자리에 자료를 올릴 예정입니다.'));
    }

    if (i === QS.length - 1) { box.appendChild(el('p', { class: 'done' }, '마지막 문항입니다. 구글 폼을 끝까지 마무리하세요.')); return; }
    if (S.unlocked > i) {
      box.appendChild(el('div', { class: 'gate' }, `<p>${i + 2}번 자료가 열려 있습니다.</p>`)).appendChild(nextBtn(i));
      return;
    }

    const gate = el('div', { class: 'gate' });
    if (!q.answer) {
      gate.appendChild(el('p', null, `폼의 ${i + 1}번 문항을 풀었다면 다음 자료로 넘어가세요.`));
      gate.appendChild(nextBtn(i, true));
    } else {
      gate.appendChild(el('p', null, q.gateText || `폼의 ${i + 1}번 문항에 적은 답을 여기에도 입력하면 ${i + 2}번 자료가 열립니다.`));
      const row = el('div', { class: 'row' });
      const inp = el('input', { type: 'text', placeholder: `${i + 1}번 답`, autocomplete: 'off', spellcheck: 'false' });
      const b = el('button', { class: 'btn', type: 'button' }, '확인');
      const msg = el('div', { class: 'msg' });
      let busy = false;
      const check = async () => {
        if (busy || !inp.value.trim()) return;
        busy = true;
        const ok = (await sha(i + '|' + norm(inp.value))) === q.answer;
        busy = false;
        if (ok) { unlock(i); return; }
        row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
        msg.className = 'msg err'; msg.textContent = '폼에 적은 답과 맞지 않는 것 같습니다. 다시 확인해 보세요.';
      };
      b.onclick = check;
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
      row.append(inp, b); gate.append(row, msg);
    }
    box.appendChild(gate);
  }
  function nextBtn(i, unlocks) {
    const b = el('button', { class: 'btn big', type: 'button' }, `${i + 2}번 자료 보기`);
    b.onclick = () => (unlocks ? unlock(i) : go(i + 1));
    return b;
  }
  function unlock(i) { S.unlocked = Math.max(S.unlocked, i + 1); save(); go(i + 1); }

  function start() {
    S.started = true; save();
    $('#intro').hidden = true; $('#main').hidden = false;
    go(S.cur);
  }

  syncGame();
  $('#btnStart').onclick = start;
  // 게임 엔딩의 '5번 문항 진행하기'에서 왔을 때 (?q=5)
  const want = +(new URLSearchParams(location.search).get('q') || 0);
  if (want) { S.cur = want - 1; start(); }
  else if (S.started) start();
})();
</script>
</body>
</html>
