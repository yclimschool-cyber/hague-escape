<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b2a1a">
<title>닫힌 문 너머로 — 1907, 헤이그</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 시작 화면 -->
  <section id="title" class="screen">
    <div class="title-inner">
      <div class="title-seal">大韓</div>
      <h1>닫힌 문 너머로<small>1907, 헤이그</small></h1>
      <div class="notice">
        <p>※ 이 게임은 1907년 헤이그 특사 사건을 바탕으로 만든 역사 방탈출입니다.</p>
        <p>주인공 김도진은 가상의 인물이며, 일부 장면과 대사, 암호 쪽지 등은 게임을 위해 새로 만든 설정입니다.</p>
        <p>사건의 날짜, 장소, 실존 인물들의 활동은 역사 기록을 바탕으로 했습니다.</p>
      </div>
      <button id="btnStart" class="btn big">시작하기</button>
      <button id="btnContinue" class="btn ghost" hidden>이어서 하기</button>
    </div>
  </section>

  <!-- 게임 화면 -->
  <section id="game" class="screen" hidden>
    <header id="hud">
      <div id="place"></div>
      <div class="hud-row">
        <div id="gauge" aria-label="감시 게이지">
          <svg class="eye" viewBox="0 0 40 24" aria-hidden="true"><defs><clipPath id="eyeClip"><path d="M2 12 Q20 -4 38 12 Q20 28 2 12Z"/></clipPath></defs><g clip-path="url(#eyeClip)"><rect width="40" height="24" fill="#f3e8cc"/><circle cx="20" cy="12" r="7" fill="#7a2418"/><circle cx="20" cy="12" r="3" fill="#1a0f08"/><rect class="lid" x="0" y="0" width="40" height="24" fill="#3b2a1a"/></g><path d="M2 12 Q20 -4 38 12 Q20 28 2 12Z" fill="none" stroke="#3b2a1a" stroke-width="1.6"/></svg>
          <div class="gbar"><div class="gfill"></div></div>
          <span class="gnum" hidden>0</span>
        </div>
      </div>
      <nav id="roomNav"></nav>
      <button id="btnMenu" class="icon-btn" aria-label="메뉴">☰</button>
    </header>
    <main id="sceneWrap">
      <div id="scene"></div>
      <div id="zoom" class="layer" hidden>
        <div class="layer-head"><span class="layer-title"></span><button class="icon-btn close" aria-label="닫기">✕</button></div>
        <div class="layer-body"></div>
      </div>
      <div id="itemView" class="layer" hidden>
        <div class="layer-head"><span class="layer-title"></span><button class="icon-btn close" aria-label="닫기">✕</button></div>
        <div class="layer-body"></div>
      </div>
    </main>
    <footer id="inventory"><div class="inv-label">소지품</div><div id="invList"></div></footer>
    <div id="pulse"></div>
  </section>

  <!-- 엔딩 -->
  <section id="ending" class="screen" hidden></section>

  <!-- 대사창 -->
  <div id="dialog" hidden>
    <div class="dbox">
      <div class="dport"></div>
      <div class="dmain"><div class="dname"></div><div class="dtext"></div></div>
      <div class="dnext">▼</div>
    </div>
  </div>

  <!-- 메뉴 -->
  <div id="menu" hidden>
    <div class="menu-box">
      <button id="btnSound" class="btn">소리: 켜짐</button>
      <button id="btnReset" class="btn">처음부터 다시 하기</button>
      <button id="btnMenuClose" class="btn ghost">닫기</button>
    </div>
  </div>

  <!-- 장소·날짜 카드 -->
  <div id="card" hidden><div class="card-inner"><div class="card-rule"></div><div class="card-text"></div><div class="card-rule"></div></div></div>

  <div id="toast"></div>
</div>
<script src="game.js"></script>
</body>
</html>
